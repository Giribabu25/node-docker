<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyBooker - Flight Booking</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6',
                600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a',
              },
            },
          },
        },
      };
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/react-router-dom@6/dist/umd/react-router-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, createContext, useContext } = React;
      const { BrowserRouter, Routes, Route, Link, useNavigate, useParams, useSearchParams } = ReactRouterDOM;

      const api = axios.create({ baseURL: '/api' });

      // ---------- Toast ----------
      const ToastCtx = createContext({ push: () => {} });
      function ToastProvider({ children }) {
        const [toasts, setToasts] = useState([]);
        const push = (msg, type = 'info') => {
          const id = Date.now() + Math.random();
          setToasts((t) => [...t, { id, msg, type }]);
          setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3500);
        };
        return (
          <ToastCtx.Provider value={{ push }}>
            {children}
            <div className="fixed top-4 right-4 z-50 space-y-2">
              {toasts.map((t) => (
                <div key={t.id}
                  className={`px-4 py-3 rounded-lg shadow-lg text-white text-sm ${
                    t.type === 'error' ? 'bg-red-500'
                    : t.type === 'success' ? 'bg-green-600'
                    : 'bg-gray-800'
                  }`}>
                  {t.msg}
                </div>
              ))}
            </div>
          </ToastCtx.Provider>
        );
      }
      const useToast = () => useContext(ToastCtx);

      // ---------- Navbar ----------
      function Navbar() {
        return (
          <nav className="bg-white border-b shadow-sm sticky top-0 z-40">
            <div className="container mx-auto px-4 py-3 flex items-center justify-between">
              <Link to="/" className="text-xl font-bold text-primary-700">✈️ SkyBooker</Link>
              <div className="flex gap-4 text-sm">
                <Link to="/flights" className="text-gray-700 hover:text-primary-600">Search</Link>
                <Link to="/bookings" className="text-gray-700 hover:text-primary-600">My Bookings</Link>
              </div>
            </div>
          </nav>
        );
      }

      // ---------- Search Form ----------
      function SearchForm({ initialValues = {} }) {
        const navigate = useNavigate();
        const [form, setForm] = useState({
          origin: initialValues.origin || '',
          destination: initialValues.destination || '',
          departureDate: initialValues.departureDate || new Date().toISOString().slice(0, 10),
          passengers: initialValues.passengers || 1,
          class: initialValues.class || 'economy',
        });
        const update = (k, v) => setForm({ ...form, [k]: v });

        const submit = (e) => {
          e.preventDefault();
          navigate(`/flights?${new URLSearchParams(form).toString()}`);
        };

        return (
          <form onSubmit={submit} className="bg-white rounded-xl shadow-sm border p-6 grid grid-cols-1 md:grid-cols-5 gap-4">
            <div>
              <label className="block text-sm font-medium mb-1">From</label>
              <input required maxLength={3} placeholder="JFK" value={form.origin}
                onChange={(e) => update('origin', e.target.value.toUpperCase())}
                className="w-full px-3 py-2 border rounded-lg uppercase focus:ring-2 focus:ring-primary-500 outline-none" />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">To</label>
              <input required maxLength={3} placeholder="LAX" value={form.destination}
                onChange={(e) => update('destination', e.target.value.toUpperCase())}
                className="w-full px-3 py-2 border rounded-lg uppercase focus:ring-2 focus:ring-primary-500 outline-none" />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Date</label>
              <input required type="date" value={form.departureDate}
                onChange={(e) => update('departureDate', e.target.value)}
                className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Passengers</label>
              <input type="number" min={1} max={9} value={form.passengers}
                onChange={(e) => update('passengers', e.target.value)}
                className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Class</label>
              <select value={form.class}
                onChange={(e) => update('class', e.target.value)}
                className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                <option value="economy">Economy</option>
                <option value="business">Business</option>
                <option value="first">First</option>
              </select>
            </div>
            <div className="md:col-span-5">
              <button type="submit"
                className="bg-primary-600 hover:bg-primary-700 text-white font-medium py-2 px-6 rounded-lg">
                🔍 Search Flights
              </button>
            </div>
          </form>
        );
      }

      // ---------- Flight Card ----------
      function FlightCard({ flight, selectedClass = 'economy' }) {
        const dep = new Date(flight.departureTime);
        const arr = new Date(flight.arrivalTime);
        const h = Math.floor(flight.duration / 60);
        const m = flight.duration % 60;
        const price = flight.price[selectedClass] || flight.price.economy;
        const fmt = (d) => d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });

        return (
          <div className="bg-white rounded-xl shadow-sm border p-6 flex flex-col md:flex-row md:items-center justify-between gap-4 hover:shadow-md transition">
            <div className="flex-1">
              <div className="text-sm text-gray-500 mb-2">
                <span className="font-semibold text-primary-700">{flight.airline}</span>
                <span> • {flight.flightNumber} • {flight.aircraft}</span>
              </div>
              <div className="flex items-center gap-4">
                <div>
                  <div className="text-2xl font-bold">{fmt(dep)}</div>
                  <div className="text-sm text-gray-600">{flight.origin.code} • {flight.origin.city}</div>
                </div>
                <div className="flex-1 flex flex-col items-center text-gray-400">
                  <div className="text-xs">{h}h {m}m</div>
                  <div className="w-full border-t border-dashed"></div>
                  <div className="text-xs">✈</div>
                </div>
                <div>
                  <div className="text-2xl font-bold">{fmt(arr)}</div>
                  <div className="text-sm text-gray-600">{flight.destination.code} • {flight.destination.city}</div>
                </div>
              </div>
            </div>
            <div className="flex md:flex-col items-center md:items-end justify-between gap-2">
              <div className="text-right">
                <div className="text-2xl font-bold text-primary-700">${price}</div>
                <div className="text-xs text-gray-500 capitalize">{selectedClass}</div>
              </div>
              <Link to={`/flights/${flight._id}?class=${selectedClass}`}
                className="bg-primary-600 hover:bg-primary-700 text-white text-sm py-2 px-4 rounded-lg">
                Select →
              </Link>
            </div>
          </div>
        );
      }

      // ---------- Seat Map ----------
      function SeatMap({ seats, selectedSeats, onToggle, seatClass }) {
        const filtered = seats.filter((s) => s.class === seatClass);
        const rows = [...new Set(filtered.map((s) => s.seatNumber.replace(/\D/g, '')))]
          .sort((a, b) => a - b);

        return (
          <div className="space-y-1">
            {rows.map((row) => {
              const rowSeats = filtered.filter((s) => parseInt(s.seatNumber) === parseInt(row));
              return (
                <div key={row} className="flex items-center gap-1">
                  <span className="w-6 text-xs text-gray-400 text-right">{row}</span>
                  <div className="flex gap-1">
                    {rowSeats.map((seat) => {
                      const isSelected = selectedSeats.includes(seat.seatNumber);
                      const disabled = seat.isBooked;
                      return (
                        <button key={seat.seatNumber} type="button" disabled={disabled}
                          onClick={() => onToggle(seat.seatNumber)} title={seat.seatNumber}
                          className={`w-8 h-8 rounded text-xs font-medium transition ${
                            disabled ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                            : isSelected ? 'bg-primary-600 text-white'
                            : 'bg-green-100 hover:bg-green-200 text-green-800'
                          }`}>
                          {seat.seatNumber.slice(-1)}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })}
            <div className="flex gap-4 pt-4 text-xs text-gray-600">
              <div className="flex items-center gap-1"><span className="w-3 h-3 bg-green-100 rounded"></span> Available</div>
              <div className="flex items-center gap-1"><span className="w-3 h-3 bg-primary-600 rounded"></span> Selected</div>
              <div className="flex items-center gap-1"><span className="w-3 h-3 bg-gray-300 rounded"></span> Booked</div>
            </div>
          </div>
        );
      }

      // ---------- Pages ----------

      function Home() {
        return (
          <div>
            <section className="text-center py-12">
              <h1 className="text-4xl md:text-5xl font-bold mb-3">Book Your Next Flight ✈️</h1>
              <p className="text-gray-600 text-lg">Search, compare, and book flights worldwide.</p>
            </section>
            <div className="max-w-5xl mx-auto"><SearchForm /></div>
            <section className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-12 max-w-5xl mx-auto">
              {[
                { icon: '🔍', title: 'Easy Search', desc: 'Find flights by route and date.' },
                { icon: '💺', title: 'Pick Your Seat', desc: 'Interactive seat map for every flight.' },
                { icon: '⚡', title: 'Instant Booking', desc: 'Confirm bookings in seconds.' },
              ].map((f) => (
                <div key={f.title} className="bg-white rounded-xl shadow-sm border p-6 text-center">
                  <div className="text-4xl mb-2">{f.icon}</div>
                  <h3 className="font-semibold text-lg">{f.title}</h3>
                  <p className="text-gray-600 text-sm">{f.desc}</p>
                </div>
              ))}
            </section>
          </div>
        );
      }

      function SearchResults() {
        const [params] = useSearchParams();
        const [flights, setFlights] = useState([]);
        const [loading, setLoading] = useState(false);
        const query = Object.fromEntries(params.entries());

        useEffect(() => {
          const run = async () => {
            setLoading(true);
            try {
              const { data } = await api.get('/flights/search', { params: query });
              setFlights(data.flights);
            } catch {
              setFlights([]);
            } finally {
              setLoading(false);
            }
          };
          if (query.origin && query.destination) run();
        }, [params]);

        return (
          <div className="space-y-6">
            <SearchForm initialValues={query} />
            <h2 className="text-xl font-semibold">
              {loading ? 'Searching...' : `${flights.length} flights found`}
            </h2>
            {!loading && flights.length === 0 && (
              <div className="bg-white rounded-xl shadow-sm border p-12 text-center text-gray-500">
                No flights found. Try a different search.
              </div>
            )}
            <div className="space-y-4">
              {flights.map((f) => <FlightCard key={f._id} flight={f} selectedClass={query.class} />)}
            </div>
          </div>
        );
      }

      function FlightDetail() {
        const { id } = useParams();
        const [params] = useSearchParams();
        const navigate = useNavigate();
        const toast = useToast();

        const [flight, setFlight] = useState(null);
        const [loading, setLoading] = useState(true);
        const [selectedSeats, setSelectedSeats] = useState([]);
        const [passengers, setPassengers] = useState([]);
        const [contact, setContact] = useState({ contactEmail: '', contactPhone: '' });

        const seatClass = params.get('class') || 'economy';

        useEffect(() => {
          (async () => {
            try {
              const { data } = await api.get(`/flights/${id}`);
              setFlight(data.flight);
            } catch {
              toast.push('Flight not found', 'error');
            } finally {
              setLoading(false);
            }
          })();
        }, [id]);

        useEffect(() => {
          setPassengers((prev) =>
            selectedSeats.map(
              (sn) => prev.find((p) => p.seatNumber === sn) || {
                firstName: '', lastName: '', dateOfBirth: '',
                passportNumber: '', nationality: '', seatNumber: sn, class: seatClass,
              }
            )
          );
        }, [selectedSeats]);

        const toggleSeat = (sn) =>
          setSelectedSeats((prev) => prev.includes(sn) ? prev.filter((s) => s !== sn) : [...prev, sn]);

        const updatePassenger = (idx, field, value) => {
          const copy = [...passengers];
          copy[idx][field] = value;
          setPassengers(copy);
        };

        const handleBooking = async () => {
          if (!selectedSeats.length) return toast.push('Select at least one seat', 'error');
          if (!contact.contactEmail || !contact.contactPhone)
            return toast.push('Provide contact email and phone', 'error');
          if (passengers.some((p) => !p.firstName || !p.lastName))
            return toast.push('Fill in all passenger names', 'error');

          try {
            const { data } = await api.post('/bookings', {
              flightId: flight._id, passengers, ...contact,
            });
            toast.push(`Booking confirmed! Ref: ${data.booking.bookingReference}`, 'success');
            navigate('/bookings');
          } catch (err) {
            toast.push(err.response?.data?.message || 'Booking failed', 'error');
          }
        };

        if (loading) return <div className="text-center py-12">Loading...</div>;
        if (!flight) return <div className="text-center py-12">Flight not found</div>;

        const price = flight.price[seatClass];
        const total = price * selectedSeats.length;

        return (
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 space-y-6">
              <div className="bg-white rounded-xl shadow-sm border p-6">
                <h2 className="text-2xl font-bold mb-2">
                  {flight.origin.city} ({flight.origin.code}) → {flight.destination.city} ({flight.destination.code})
                </h2>
                <div className="text-gray-600 text-sm mb-4">
                  {flight.airline} • {flight.flightNumber} • {flight.aircraft}
                </div>
                <div className="grid grid-cols-2 gap-4 text-sm">
                  <div>
                    <div className="text-gray-500">Departure</div>
                    <div className="font-semibold">{new Date(flight.departureTime).toLocaleString()}</div>
                  </div>
                  <div>
                    <div className="text-gray-500">Arrival</div>
                    <div className="font-semibold">{new Date(flight.arrivalTime).toLocaleString()}</div>
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-xl shadow-sm border p-6">
                <h3 className="font-semibold text-lg mb-3">Select Seats ({seatClass})</h3>
                <SeatMap seats={flight.seats} selectedSeats={selectedSeats}
                  onToggle={toggleSeat} seatClass={seatClass} />
              </div>

              {passengers.length > 0 && (
                <div className="bg-white rounded-xl shadow-sm border p-6 space-y-4">
                  <h3 className="font-semibold text-lg">Passenger Details</h3>
                  {passengers.map((p, idx) => (
                    <div key={p.seatNumber} className="border rounded-lg p-4 space-y-3">
                      <div className="font-medium text-sm text-primary-700">Seat {p.seatNumber}</div>
                      <div className="grid grid-cols-2 gap-3">
                        <input placeholder="First Name" className="px-3 py-2 border rounded-lg"
                          value={p.firstName} onChange={(e) => updatePassenger(idx, 'firstName', e.target.value)} />
                        <input placeholder="Last Name" className="px-3 py-2 border rounded-lg"
                          value={p.lastName} onChange={(e) => updatePassenger(idx, 'lastName', e.target.value)} />
                        <input type="date" className="px-3 py-2 border rounded-lg"
                          value={p.dateOfBirth} onChange={(e) => updatePassenger(idx, 'dateOfBirth', e.target.value)} />
                        <input placeholder="Passport No." className="px-3 py-2 border rounded-lg"
                          value={p.passportNumber} onChange={(e) => updatePassenger(idx, 'passportNumber', e.target.value)} />
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div>
              <div className="bg-white rounded-xl shadow-sm border p-6 sticky top-20">
                <h3 className="font-semibold text-lg mb-4">Booking Summary</h3>
                <div className="space-y-2 text-sm mb-4">
                  <div className="flex justify-between"><span className="text-gray-600">Class</span><span className="capitalize font-medium">{seatClass}</span></div>
                  <div className="flex justify-between"><span className="text-gray-600">Price/seat</span><span className="font-medium">${price}</span></div>
                  <div className="flex justify-between"><span className="text-gray-600">Seats</span><span className="font-medium">{selectedSeats.length}</span></div>
                  <div className="flex justify-between border-t pt-2"><span className="font-semibold">Total</span><span className="font-bold text-primary-700">${total}</span></div>
                </div>
                <div className="space-y-3 border-t pt-4">
                  <input type="email" placeholder="Contact Email" className="w-full px-3 py-2 border rounded-lg"
                    value={contact.contactEmail} onChange={(e) => setContact({ ...contact, contactEmail: e.target.value })} />
                  <input type="tel" placeholder="Contact Phone" className="w-full px-3 py-2 border rounded-lg"
                    value={contact.contactPhone} onChange={(e) => setContact({ ...contact, contactPhone: e.target.value })} />
                </div>
                <button onClick={handleBooking} disabled={!selectedSeats.length}
                  className="w-full mt-4 bg-primary-600 hover:bg-primary-700 text-white py-2 px-4 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed">
                  Confirm Booking
                </button>
              </div>
            </div>
          </div>
        );
      }

      function MyBookings() {
        const [bookings, setBookings] = useState([]);
        const [loading, setLoading] = useState(true);
        const toast = useToast();

        const load = async () => {
          setLoading(true);
          try {
            const { data } = await api.get('/bookings');
            setBookings(data.bookings);
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => { load(); }, []);

        const cancel = async (id) => {
          if (!confirm('Cancel this booking?')) return;
          try {
            await api.put(`/bookings/${id}/cancel`, { reason: 'User requested' });
            toast.push('Booking cancelled', 'success');
            load();
          } catch (err) {
            toast.push(err.response?.data?.message || 'Cancel failed', 'error');
          }
        };

        if (loading) return <div className="text-center py-12">Loading...</div>;

        if (!bookings.length) {
          return (
            <div className="bg-white rounded-xl shadow
